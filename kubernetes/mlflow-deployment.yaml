apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-mlflow
  labels:
    app: voyage-mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voyage-mlflow
  template:
    metadata:
      labels:
        app: voyage-mlflow
    spec:
      containers:
      - name: mlflow
        image: python:3.10-slim
        command: ["sh", "-c"]
        args:
          - "pip install mlflow && mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db"
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: mlflow-db-storage
          mountPath: /mlflow
      volumes:
      - name: mlflow-db-storage
        persistentVolumeClaim:
          claimName: mlflow-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voyage-mlflow-service
spec:
  selector:
    app: voyage-mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP

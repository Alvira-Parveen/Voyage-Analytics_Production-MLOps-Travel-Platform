[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src", "api", "training", "dashboard"]
known_third_party = [
    "pandas",
    "numpy",
    "scipy",
    "sklearn",
    "xgboost",
    "lightgbm",
    "surprise",
    "joblib",
    "mlflow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "slowapi",
    "requests",
    "httpx",
    "dotenv",
    "streamlit",
    "plotly",
    "matplotlib",
    "seaborn",
    "prometheus_client",
    "prometheus_fastapi_instrumentator",
]
